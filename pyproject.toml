[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bracket-ml"
version = "0.1.0"
description = "Hyperparameter search and VLM-judged ranking for diffusion-model fine-tunes. Drives sd-scripts and musubi-tuner; emits a markdown report with statistical confidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thomas Lennon" }]
keywords = [
    "diffusion",
    "fine-tuning",
    "hyperparameter-search",
    "automl",
    "sdxl",
    "z-image",
    "flux",
    "lora",
    "optuna",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tensorboard>=2.15",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "protobuf>=4.21",
    "toml>=0.10",
    "pyyaml>=6.0",
    "optuna>=3.5",
    "pandas>=2.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
# Optional no-reference image-quality metrics (CLIP-IQA, MUSIQ, MANIQA)
# used by bracket.judge.clip_iqa as a DQ gate alongside the VLM judge.
# Heavy pull (torch + open-clip-torch); install with `pip install -e .[vision_metrics]`.
vision_metrics = [
    "pyiqa>=0.1.10",
    "Pillow>=10",
]
# Optional Bradley-Terry MLE solver. Bracket ships its own hand-rolled MM
# implementation in `bracket.proof.pairwise_ranking`, so `choix` is only
# needed by callers that want to fit BT against larger external datasets
# or compare against a second implementation.
pairwise_eval = [
    "choix>=0.3.4",
]

[project.urls]
Homepage = "https://github.com/tlennon-ie/bracket"
Repository = "https://github.com/tlennon-ie/bracket"
Issues = "https://github.com/tlennon-ie/bracket/issues"

[project.scripts]
bracket = "bracket.cli.orchestrate:main"
bracket-serve = "bracket.api.cli:main"

[tool.setuptools.packages.find]
include = ["bracket*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "websocket: WebSocket integration tests (deselect with '-m \"not websocket\"').",
]
